<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        body {
            display: grid;
            height: 100vh;
            place-items: center;
        }
        #container img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            outline: 5px solid red;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.493); 
            transform: translateX(100px) scale(1.5) rotate(-45deg) skew(10deg);
        }
    </style>
</head>
<body>
    <!--
        Preliminares de Animações
            1. Transform
            2. Transition
     -->
        <div id="container">
            <img src="girl.png" alt="Girl">
        </div>
</body>
</html>
