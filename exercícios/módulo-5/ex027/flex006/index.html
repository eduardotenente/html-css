<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            height: 400px;

            display: flex;
            flex-flow: row wrap;
            align-content: space-between;  
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            padding: 40px;

        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">AAA</div>
        <div class="item">BBB</div>
        <div class="item">CCC</div>
        <div class="item">DDD</div>
        <div class="item">EEE</div>
        <div class="item">FFF</div>
        <div class="item">GGG</div>
        <div class="item">HHH</div>
        <div class="item">III</div>
        <div class="item">JJJ</div>
        <div class="item">LLL</div>
        <div class="item">MMM</div>
    </div>
</body>
</html>
