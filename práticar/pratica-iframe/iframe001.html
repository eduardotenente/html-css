<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando iframes</title>
    <style>
        iframe{
            width: 400px;
            height: 400px;
            border: 1px dashed red;
        }
    </style>
</head>
<body>
    <h1>Parceiros, Patrocinadores e Fundadores</h1>

    <p>Veja o site de nossos parceiros! 
        <iframe src="https://br.pinterest.com/?show_error=true" frameborder="1" scolling="yes">
            <a href="https://br.pinterest.com/?show_error=true" target="_blank" rel="external">Nossos Parceiros</a>
        </iframe>
    </p>

    <p>
        Patrocinador
        <iframe src="https://soundcloud.com/discover" frameborder="1" scolling="no">
            <a href="https://soundcloud.com/discover" target="_blank" rel="external">Nosso Patrocinador</a>
        </iframe>
    </p>

    <p>
        Nosso fundador
        <iframe src="https://coolors.co/" frameborder="1">
            <a href="https://coolors.co/" target="_blank" rel="external">Fundador</a>
        </iframe>
    </p>
</body>
</html>
