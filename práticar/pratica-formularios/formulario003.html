<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo/form003.css">
    <title>Gostos</title>
</head>
<body>
    <header>
        <h1>Diga seus Gostos!</h1>
    </header>

    <form action="cadastro.php" method="post">
        <fieldset>
            <legend>Tipos Musicais</legend>

            <input type="checkbox" name="metal" id="imetal">
            <label for="imetal">Metal</label>
            
            <input type="checkbox" name="rock" id="irock">
            <label for="irock">Rock</label>
            
            <input type="checkbox" name="phonk" id="iphonk">
            <label for="iphonk">Phonk</label>
            
            <input type="checkbox" name="eletronica" id="ieletronica">
            <label for="ieletronica">Eletrônica</label>
            
            <input type="checkbox" name="funk" id="ifunk">
            <label for="ifunk">Funk</label>
            
            <input type="checkbox" name="jpop" id="ijpop">
            <label for="ijpop">Jpop</label>
            
            <input type="checkbox" name="rap" id="irap">
            <label for="irap">Rap</label>
            
            <input type="checkbox" name="trap" id="itrap">
            <label for="itrap">Trap</label>
        </fieldset>

        <fieldset>
            <legend>Jogos</legend>

            <input type="checkbox" name="aventura" id="iave">
            <label for="iave">Aventura</label>

            <input type="checkbox" name="açao" id="iaç">
            <label for="iaç">Ação</label>

            <input type="checkbox" name="fps" id="ifps">
            <label for="ifps">FPS</label>

            <input type="checkbox" name="hist" id="ihist">
            <label for="ihist">História</label>

            <input type="checkbox" name="mj" id="imj">
            <label for="imj">Minijogo</label>

            <input type="checkbox" name="terror" id="iterror">
            <label for="iterror">Terror</label>

            <input type="checkbox" name="enigma" id="ienigma">
            <label for="ienigma">Enigma</label>
        </fieldset>

        <fieldset>
            <legend>Filmes</legend>

            <input type="checkbox" name="aç" id="iaçf">
            <label for="iaçf">Ação</label>

            <input type="checkbox" name="terror" id="itr">
            <label for="itr">Terror</label>

            <input type="checkbox" name="comedia" id="icomedia">
            <label for="icomedia">Comédia</label>

            <input type="checkbox" name="romance" id="iromance">
            <label for="iromance">Romance</label>

            <input type="checkbox" name="fant" id="ifant">
            <label for="ifant">Fantasia</label>
        </fieldset>   

        <fieldset>
            <legend>Animação</legend>

            <input type="checkbox" name="DA" id="iDA">
            <label for="iDA">Desenho Adulto</label>

            <input type="checkbox" name="anime" id="ianime">
            <label for="ianime">Anime</label>

            <input type="checkbox" name="DI" id="iDI">
            <label for="iDI">Desenho Infantil</label>
            
            <input type="checkbox" name="fanart" id="ifanart">
            <label for="ifanart">Fanart</label>
        </fieldset>
        
        <fieldset>
            <legend>Comidas</legend>

            <input type="checkbox" name="strogonoff" id="istrog">
            <label for="istrog">Strogonoff</label>

            <input type="checkbox" name="empadao" id="iemp">
            <label for="iemp">Empadão</label>

            <input type="checkbox" name="pastel" id="ip">
            <label for="ip">Pastel</label>

            <input type="checkbox" name="lasanha" id="ila">
            <label for="ila">Lasanha</label>

            <input type="checkbox" name="bife" id="ib">
            <label for="ib">Bife</label>

            <input type="checkbox" name="TF" id="iTF">
            <label for="iTF">Torta de Frango</label>
        </fieldset>

        <fieldset>
            <legend>Sobremesas</legend>

            <input type="checkbox" name="mussi" id="imu">
            <label for="imu">Mussi</label>

            <input type="checkbox" name="sorvete" id="iso">
            <label for="iso">Sorvete</label>

            <input type="checkbox" name="bolo" id="ibolo">
            <label for="ibolo">Bolo</label>

            <input type="checkbox" name="brig" id="ibrig">
            <label for="ibrig">Brigadeiro</label>

            <input type="checkbox" name="geleia" id="ige">
            <label for="ige">Geleia</label>

            <input type="checkbox" name="TM" id="iTM">
            <label for="iTM">Tudo de Maracujá</label>
        </fieldset>
        <p>
            <label for="icor">Cor Favorita</label>
            <input type="color" name="Cor" id="icor">
        </p>
        <p>
            <label for="inivel">Satisfação com o Quiz</label>
            <input type="range" name="nivel" id="inivel" min="1" max="5" value="1" oninput="ini.innerHTML = Number(inivel.value)">
            <output id="ini">1</output>
        </p>

        <p>
            <input type="submit" value="Enviar" class="botao">
            <input type="reset" value="Limpar" class="botao">
        </p>
    </form>

    <a href="pagina-extra/pag001.html" target="_self" rel="internal">
        Não tem conta? Faça uma agora!
    </a>
</body>
</html>
