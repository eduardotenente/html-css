<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento de Consulta</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        body {
            background-color: powderblue;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            background-color: lightsteelblue;
            padding-bottom: 50px;
            padding-top: 15px;
            box-shadow: 3px 3px 7px rgba(0, 0, 0, 0.404);
        }

        header > h1 {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            text-align: center;
            margin-top: 20px;
        }

        form {
            background-color: white;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -80%);
            padding: 20px;
            padding-bottom: 40px;
            border-radius: 10px;
            box-shadow: 3px 3px 7px rgba(0, 0, 0, 0.363);
        }

        legend {
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        input {
            background-color: rgba(211, 211, 211, 0.74);
            border: none;
            padding: 2px 1px 1px 1px;
            margin-bottom: 15px;
        }

        p#botton{
            margin-left: 40px;
        }

        input.animation{
            background-color: green;
            color: white;
            font-weight: bold;
            margin-top: 30px;
            padding: 10px;
            box-shadow: 2px 2px 7px rgba(0, 0, 0, 0.425);
        }

        input.animation#space {
            margin-left: 30px;
        }

        input.animation:hover {
            background-color: crimson;
            transform: translate(-5%, -5%);
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.445);
            transition: 0.5s;
        }
    </style>
</head>
<body>
    <header>
        <h1>Venha ser Consultado!</h1>
    </header>

        <form action="cadastro.php" method="post">
            <legend>
                Preencha seus dados para agendar uma consulta
            </legend>
            <p>
                <label for="inome">Nome Completo</label>
                <input type="text" name="nome" id="inome" required minlength="1" placeholder="Nome">
            </p>
            <p>
                <label for="iemail">Email</label>
                <input type="email" name="email" id="iemail" required autocomplete="email" placeholder="Email">
            </p>
            <p>
                <label for="itel">Telefone</label>
                <input type="tel" name="telefone" id="itel" required autocomplete="tel" pattern="^\(\d{2}\)\d{4,5}-\d{4}$" placeholder="(xx) xxxxx-xxxx">
            </p>
            <p>
                <label for="icpf">CPF</label>
                <input type="number" name="cpf" id="icpf" placeholder="Digite seu CPF" required>
            </p>
            <p>
                <label for="idata">Dia para se Consultar</label>
                <input type="date" name="dia" id="idata" required>
            </p>
            <p>
                <label for="ihora">Horário Desejado</label>
                <input type="time" name="hora" id="ihora" required value="12:00">
            </p>

            <p id="botton">
                <input type="submit" value="Finalizar" class="animation">
                <input type="reset" value="Limpar Seções" class="animation" id="space">
            </p>
        </form>
    
</body>
</html>
