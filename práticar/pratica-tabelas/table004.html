<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfabeto</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
            width: 300px;
        }

        td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Mesclando o Alfabeto</h1>

    <table>
        <tr>
            <td colspan="3">A</td>
            
            <td>D</td>
        </tr>
        <tr>
            <td rowspan="3">E</td>
            <td>F</td>
            <td colspan="2" rowspan="2">G</td>
            
        </tr>
        <tr>
            
            <td>J</td>
            
            
        </tr>
        <tr>
            
            <td rowspan="2">O</td>
            <td>P</td>
            <td>Q</td>
        </tr>
        <tr>
            <td>R</td>
            
            <td>U</td>
            <td>V</td>
        </tr>
        <tr>
            <td>W</td>
            
            <td colspan="2">Y</td>
            <td>Z</td>
        </tr>
    </table>
</body>
</html>
